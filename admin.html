<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuiltClient Admin</title><style>body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:500px;background:#15151d;border:1px solid #292936;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;margin:8px 0 15px;border-radius:10px}input{box-sizing:border-box;border:1px solid #383844;background:#0d0d13;color:#fff}button{border:0;background:#8b5cf6;color:#fff;font-weight:bold}.hidden{display:none}.status{margin-top:15px;padding:12px;background:#0d0d13;white-space:pre-wrap;border-radius:10px}</style></head><body><div class="card"><h1>QuiltClient Admin</h1><p>Replace the current QuiltClient JAR</p><div id="login"><input id="password" type="password" placeholder="Admin password"><button id="check">Check Password</button></div><div id="panel" class="hidden"><input id="jar" type="file" accept=".jar"><button id="upload">Replace Download</button></div><div id="status" class="status">Waiting...</div></div><script>const API="https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";const p=document.getElementById('password'),s=document.getElementById('status');const msg=x=>s.textContent=x;document.getElementById('check').onclick=async()=>{if(!p.value)return msg('Enter the password.');try{const r=await fetch(API+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Incorrect password.');document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');msg('Access granted.')}catch(e){msg(e.message)}};document.getElementById('upload').onclick=async()=>{const f=document.getElementById('jar').files[0];if(!f)return msg('Select a JAR file first.');if(!f.name.toLowerCase().endsWith('.jar'))return msg('Only .jar files are allowed.');msg('Uploading and replacing...');try{const form=new FormData();form.append('password',p.value);form.append('file',f,f.name);const r=await fetch(API+'/upload',{method:'POST',body:form});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload failed.');msg('Upload successful!\nThe existing QuiltClient JAR has been replaced.');document.getElementById('jar').value=''}catch(e){msg(e.message)}};</script></body></html>
